      - name: Generate Shared Certificates & Keystore
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout private.pem \
            -out certificate.pem \
            -days 10000 \
            -subj "/CN=MiBandPhoto/OU=Dev/O=User/L=City/ST=State/C=RU"

          openssl pkcs12 -export \
            -in certificate.pem \
            -inkey private.pem \
            -out shared.p12 \
            -name mibandkey \
            -passout pass:miband123

          keytool -importkeystore \
            -srckeystore shared.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass miband123 \
            -destkeystore shared.jks \
            -deststoretype JKS \
            -deststorepass miband123 \
            -noprompt

          mkdir -p watch-app/sign/debug watch-app/sign/release watch-app/src/sign/debug watch-app/src/sign/release
          cp private.pem certificate.pem watch-app/sign/
          cp private.pem certificate.pem watch-app/sign/debug/
          cp private.pem certificate.pem watch-app/sign/release/
          cp private.pem certificate.pem watch-app/src/sign/debug/
          cp private.pem certificate.pem watch-app/src/sign/release/

      - name: Build Official Xiaomi Vela Watch App (.rpk)
        working-directory: ./watch-app
        run: |
          npm install
          npx aiot build
          npx aiot release || true
          ls -la dist/
          cp dist/*.rpk ./miband10_photo.rpk || true

      - name: Install Gradle 8.7 & Build Signed Android APK (.apk)
        working-directory: ./android-app
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: Upload Ready-to-Install RPK and APK
        uses: actions/upload-artifact@v4
        with:
          name: MiBand10-Photo-Apps
          path: |
            watch-app/dist/*.rpk
            watch-app/*.rpk
            android-app/app/build/outputs/apk/release/*.apk
