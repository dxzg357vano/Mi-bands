      - name: Generate Shared Certificates & Keystore
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout private.pem \
            -out certificate.pem \
            -days 10000 \
            -subj "/CN=MiBandPhoto/OU=Dev/O=User/L=City/ST=State/C=RU"

          openssl pkcs12 -export \
            -in certificate.pem \
            -inkey private.pem \
            -out shared.p12 \
            -name mibandkey \
            -passout pass:miband123

          keytool -importkeystore \
            -srckeystore shared.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass miband123 \
            -destkeystore shared.jks \
            -deststoretype JKS \
            -deststorepass miband123 \
            -noprompt

          mkdir -p watch-app/sign/debug watch-app/sign/release
          cp private.pem certificate.pem watch-app/sign/debug/
          cp private.pem certificate.pem watch-app/sign/release/

      - name: Build Xiaomi Vela Watch App (.rpk)
        working-directory: ./watch-app
        run: |
          npm install -g aiot-toolkit || true
          aiot build || true
          python3 - << 'EOF_PY'
          import hashlib, json, pathlib, subprocess, zipfile
          watch_dir = pathlib.Path(".").resolve()
          src_dir = watch_dir / "src"
          dist_dir = watch_dir / "dist"
          dist_dir.mkdir(parents=True, exist_ok=True)
          if not list(dist_dir.glob("*.rpk")):
              manifest = json.loads((watch_dir / "manifest.json").read_text(encoding="utf-8"))
              pkg_name = manifest.get("package", "com.miband10.phototransfer")
              ver_name = manifest.get("versionName", "1.0.0")
              rpk_path = dist_dir / f"{pkg_name}.release.{ver_name}.rpk"
              files_map = {p.relative_to(src_dir).as_posix(): p for p in src_dir.rglob("*") if p.is_file()}
              files_map["manifest.json"] = watch_dir / "manifest.json"
              hashes = {rel: hashlib.sha256(p.read_bytes()).hexdigest() for rel, p in sorted(files_map.items())}
              cert_dir = watch_dir / "build_cert"
              cert_dir.mkdir(parents=True, exist_ok=True)
              hash_json = cert_dir / "hash.json"
              hash_json.write_text(json.dumps(hashes, indent=2), encoding="utf-8")
              priv_pem = watch_dir / "sign" / "release" / "private.pem"
              cert_pem = watch_dir / "sign" / "release" / "certificate.pem"
              sig_path = cert_dir / "signature.bin"
              if priv_pem.exists():
                  subprocess.run(["openssl", "dgst", "-sha256", "-sign", str(priv_pem), "-out", str(sig_path), str(hash_json)], check=False)
              cert_zip = cert_dir / "CERT"
              with zipfile.ZipFile(cert_zip, "w", zipfile.ZIP_DEFLATED) as cz:
                  cz.write(hash_json, "hash.json")
                  if cert_pem.exists(): cz.write(cert_pem, "certificate.pem")
                  if sig_path.exists(): cz.write(sig_path, "signature.bin")
              with zipfile.ZipFile(rpk_path, "w", zipfile.ZIP_DEFLATED) as rz:
                  for rel, p in sorted(files_map.items()): rz.write(p, rel)
                  rz.write(cert_zip, "META-INF/CERT")
              print("Built RPK:", rpk_path)
          EOF_PY
          ls -la dist/

      - name: Install Gradle 8.7 & Build Signed Android APK (.apk)
        working-directory: ./android-app
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: Upload Ready-to-Install RPK and APK
        uses: actions/upload-artifact@v4
        with:
          name: MiBand10-Photo-Apps
          path: |
            watch-app/dist/*.rpk
            android-app/app/build/outputs/apk/release/*.apk
